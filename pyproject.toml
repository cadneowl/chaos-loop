[project]
name = "chaos"
version = "0.0.1"
description = "Closed-loop, security-aware chaos engineering with Claude agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "kosta" }]

dependencies = [
    # Multi-backend LLM client (Anthropic, Ollama, OpenAI, etc.). Strategies use this.
    "litellm>=1.85.0",
    # Contracts
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    # Orchestration
    "structlog>=25.5.0",
    "rich>=15.0.0",
    "typer>=0.25.1",
    # Kubernetes (sync client; we wrap in asyncio.to_thread)
    "kubernetes>=35.0.0",
    # HTTP client used by Loki + Prometheus backends
    "httpx>=0.28.1",
    # YAML for experiment plans
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "types-PyYAML>=6.0.12.20260518",
]

[project.scripts]
chaos = "orchestrator.main:app"

# Experiment plugins are discovered from this entry-point group (plus the local
# $CHAOS_PLUGINS_DIR). Customers add their own scenario here from their package.
[project.entry-points."chaos.plugins"]
example-keyvalue = "plugins.examples.keyvalue_scenario:KeyValueScenario"
example-web-service = "plugins.examples.web_service_scenario:WebServiceScenario"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer's pattern is `arg: T = typer.Option(...)`, which ruff's B008 flags as a
# function-call-in-default. This is the documented typer convention; suppress here.
"**/agent.py" = ["B008"]
"**/tools.py" = ["B008"]
"**/pr_template.py" = ["B008"]
"**/similarity.py" = ["B008"]
"orchestrator/main.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # pytest tries to collect any class named Test* — even Pydantic models imported into a test file.
    # We belt-and-suspenders this with __test__ = False on the relevant classes too.
    "ignore::pytest.PytestCollectionWarning",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
# Bare `dict` / `list` / `tuple` are pervasive in pydantic models and rule
# tables; adding `[str, Any]` everywhere is noise. The rest of strict mode is
# meaningful and stays on.
disallow_any_generics = false

# The kubernetes client ships without py.typed. We don't want every
# `from kubernetes import client` to emit an error.
[[tool.mypy.overrides]]
module = ["kubernetes", "kubernetes.*"]
ignore_missing_imports = true

# HTTP / Prometheus / Loki backends and KubernetesClusterIO all return JSON
# dicts coming back as ``Any`` from upstream libraries. We accept that boundary
# rather than wallpaper with ``cast`` calls.
[[tool.mypy.overrides]]
module = [
    "agents.chaos.cluster",
    "agents.tester.tools.prometheus",
    "agents.diagnostician.tools.loki",
]
warn_return_any = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "orchestrator", "agents", "plugins"]

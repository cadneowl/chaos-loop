; PlatformIO build config for the chaos-attacker-esp32 sketch.
;
; Targets a generic ESP32-WROOM-32 dev board over USB serial at 115200.
; Add an SX1276/SX1262 module on SPI for LoRa-jam support — see README.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ESP-IDF flags
build_flags =
    -DCHAOS_FIRMWARE_VERSION=\"0.1.0\"
    -DCHAOS_DEVICE_SERIAL=\"AT-bench-001\"
    -DCHAOS_HARDWARE_REV=\"rev-A\"
    ; Maximum transmit power across all RF faults, dBm. Clamped at runtime;
    ; safe ISM default. Set this per the operator's emission license.
    -DCHAOS_MAX_TX_DBM=14
    ; GPIO that selects BENCH vs PRODUCTION mode. Open = BENCH, pulled to
    ; GND = PRODUCTION (firmware refuses all chaos commands).
    -DCHAOS_BENCH_MODE_GPIO=27

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    ; Uncomment when wiring a LoRa module:
    ; sandeepmistry/LoRa @ ^0.8.0

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: chaos
nodes:
  - role: control-plane
    extraPortMappings:
      # Expose Grafana / Prometheus / target app via NodePort -> host
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30090
        hostPort: 30090
        protocol: TCP
      - containerPort: 30030
        hostPort: 30030
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"

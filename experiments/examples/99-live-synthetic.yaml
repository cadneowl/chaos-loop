experiment_id: exp-1eaf00ddba11
title: "LIVE: synthetic probes — verify chaos-mesh injects network loss on valkey-cart"
target_app: synthetic
target_repo: https://github.com/open-telemetry/opentelemetry-demo

faults:
  - category: network
    name: network.loss
    target_selector:
      app.kubernetes.io/component: valkey-cart
    parameters:
      loss_percent: 100
      direction: to
    duration_seconds: 20
    requires_approval: false
    rationale: |
      End-to-end test of the chaos pipeline on the live cluster. Uses the
      synthetic probe set (queries Prometheus self-metrics) so we can verify
      that chaos-mesh actually injects the NetworkChaos CRD without depending
      on otel-demo metric names.
    hypothesis_id: h-otel-cart-redis-001

safety:
  cluster_context: kind-chaos-dev
  namespace: otel-demo
  max_pods_affected: 1
  max_duration_seconds: 60
  allow_multi_fault: false
  require_namespace_annotation: true

budget:
  soft_cap_usd: 1.0
  hard_cap_usd: 5.0
  wall_clock_seconds: 600

quiet_window_pre_seconds: 5
quiet_window_post_seconds: 5

# Metric-oracle regression suite: does checkout p95 latency hold under fault,
# and has the steady-state distribution drifted between releases?
#
# Replay (dry-run, no Prometheus):
#   chaos regression run experiments/examples/regression/latency.yaml --dry-run
# Freeze a golden, then compare a later run's baseline distribution against it:
#   chaos regression run latency.yaml --prom-url http://localhost:9090 --save-golden --target-ref v1.2.3
#   chaos regression run latency.yaml --prom-url http://localhost:9090 --drift-against v1.2.3 --fail-on-drift
name: checkout-latency
target_app: otel-demo
target_repo: https://github.com/open-telemetry/opentelemetry-demo

safety:
  cluster_context: kind-chaos
  namespace: otel-demo
  max_pods_affected: 1
  max_duration_seconds: 120
  require_namespace_annotation: true

oracle: metric
oracle_defaults:
  window_seconds: 300      # sample each metric over a 5-minute window
  step_seconds: 15
  # A regression is a percentile moving past its budget in the WORSE direction:
  #   higher_worse (default) — latency, error rate
  #   lower_worse            — throughput, availability
  metrics:
    - metric: checkout_p95_latency_ms
      query: >
        histogram_quantile(0.95, sum by (le)
        (rate(http_server_duration_milliseconds_bucket{http_route="/checkout"}[1m])))
      percentile: p95
      max_ratio: 1.20        # tolerate a 20% drift before flagging
    - metric: checkout_error_rate
      query: >
        sum(rate(http_server_requests_total{http_route="/checkout",http_status_code=~"5.."}[1m]))
        / sum(rate(http_server_requests_total{http_route="/checkout"}[1m]))
      percentile: mean
      max_ratio: 1.50
      abs_floor: 0.001       # ignore drift when the golden error rate is < 0.1%

all_journeys:
  - "checkout.spec.ts:pay"

scenarios:
  - title: checkout latency holds under payment-service CPU pressure
    fault:
      category: stress
      name: stress.cpu
      target_selector:
        app.kubernetes.io/component: payment
      duration_seconds: 60
      rationale: >
        payment is on the checkout hot path; verify p95 latency and the error
        rate stay within budget when its CPU is saturated.
    journeys:
      - "checkout.spec.ts:pay"

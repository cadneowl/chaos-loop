# Hypothesis: cartservice serves a degraded response when valkey-cart is unreachable.
# Maps to: target/hypotheses-seed.yaml h-otel-cart-redis-001
experiment_id: exp-000000000001
title: "OTel cartservice tolerates valkey-cart network loss"
target_app: otel-demo
target_repo: https://github.com/open-telemetry/opentelemetry-demo

faults:
  - category: network
    name: network.loss
    target_selector:
      app.kubernetes.io/component: valkey-cart
    parameters:
      loss_percent: 100
      direction: to
    duration_seconds: 60
    requires_approval: false
    rationale: |
      cartservice has a hard dep on valkey-cart with no documented fallback;
      test whether it degrades gracefully (target: 503 + frontend "cart unavailable")
      or hangs/cascades (anti-pattern).
    hypothesis_id: h-otel-cart-redis-001

safety:
  cluster_context: kind-chaos
  namespace: otel-demo
  max_pods_affected: 1
  max_duration_seconds: 120
  allow_multi_fault: false
  require_namespace_annotation: true

budget:
  soft_cap_usd: 1.0
  hard_cap_usd: 5.0
  wall_clock_seconds: 900

quiet_window_pre_seconds: 60
quiet_window_post_seconds: 60

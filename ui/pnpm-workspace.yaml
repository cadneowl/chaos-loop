packages:
  - "server"
  - "web"

# Allow these packages to run install-time build scripts (compile native
# bindings, copy binaries, etc.). pnpm 11 blocks scripts by default; each
# `true` here is one we explicitly trust.
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  unrs-resolver: true

name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel in-progress runs on the same branch when a new push arrives — saves
# CI minutes and surfaces only the latest commit's status.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Opt into Node 24 for the JS actions. GitHub deprecated Node 20 in
# September 2025 and forces Node 24 from June 2nd 2026; this gets us
# ahead of the forced switch without a noisy deprecation warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-type-test:
    name: ruff · mypy · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor we declare in pyproject.toml; 3.13 is the dev box.
        # Both must pass — if a 3.13-only feature sneaks in, 3.11 catches it.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: mypy strict
        run: mypy agents/ shared/ orchestrator/ plugins/

      - name: pytest
        run: pytest tests/ -q --cov=agents --cov=shared --cov=orchestrator --cov=plugins --cov-report=term

      # Smoke-test the CLI surface so a broken typer wiring trips CI rather
      # than the user. Cheap, no external deps.
      - name: chaos --help
        run: chaos --help

      - name: chaos list-faults
        run: chaos list-faults

      # Render + inject + clean up every hardware fault against the
      # simulator. Catches catalogue / renderer / simulator drift; same
      # gate `neoowl-defense` will run against the real bench in CI.
      - name: chaos catalogue verify
        run: chaos catalogue verify

  ui:
    name: ui — server + web · build + test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # The UI lives in `ui/` as a pnpm workspace. We only run when files
    # there or in this workflow itself change; the Python-only matrix
    # above carries the rest of CI.
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: pnpm install (workspace)
        run: pnpm install --frozen-lockfile

      - name: server — build
        run: pnpm --filter @chaos/ui-server build

      - name: server — test
        run: pnpm --filter @chaos/ui-server test

      - name: web — test
        run: pnpm --filter @chaos/ui-web test

      - name: web — build
        run: pnpm --filter @chaos/ui-web build
